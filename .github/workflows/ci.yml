# ForsaLaw – CI : build backend/frontend sur chaque push/PR
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Build & tests
        # Les tests d'integration Testcontainers demarrent un conteneur PostgreSQL ;
        # le runner ubuntu-latest fournit un daemon Docker.
        run: mvn -B verify

  frontend:
    name: Frontend (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Verifie uniquement que les images se CONSTRUISENT : aucune publication vers un
      # registre. Les tests ne tournent pas ici (ils sont deja executes par le job backend,
      # et l'image les ignore volontairement : Testcontainers exige un daemon Docker,
      # indisponible a l'interieur d'un build d'image).
      - name: Build backend image
        run: docker build -t forsalaw-backend:ci ./backend

      - name: Build frontend image
        run: docker build -t forsalaw-frontend:ci ./frontend

      # La configuration Nginx n'est validee qu'au demarrage : une erreur de syntaxe passerait
      # le build et ne casserait qu'au deploiement.
      - name: Validate nginx configuration
        run: docker run --rm forsalaw-frontend:ci nginx -t

      # `docker images` n'accepte qu'un seul depot par appel.
      - name: Image sizes
        run: |
          docker images forsalaw-backend:ci
          docker images forsalaw-frontend:ci

  quality:
    name: Repo quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check structure
        run: |
          echo "ForsaLaw repo structure check"
          [ -f backend/pom.xml ] && echo "  backend/pom.xml OK" || true
          [ -d backend/src ] && echo "  backend/src OK" || true
          [ -d frontend ] && echo "  frontend/ OK" || true

  sonarqube:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17 (for Sonar Java analysis)
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Prepare Java binaries for Sonar
        if: ${{ env.SONAR_TOKEN != '' }}
        working-directory: backend
        run: mvn -q -B compile -DskipTests

      # Analyse SonarCloud NON bloquante : un token absent/invalide (rotation, dev solo) ne doit
      # pas faire echouer la CI. Le scan tourne quand un token est present, mais son echec
      # (ex. 403) laisse le job vert. Reactiver un gate strict quand le token est stabilise.
      - name: SonarCloud Scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.projectKey=ForsaLaw_ForsaLaw
            -Dsonar.organization=forsalaw
            -Dsonar.projectName=ForsaLaw
            -Dsonar.sources=backend/src/main,frontend/src
            -Dsonar.java.binaries=backend/target/classes
            -Dsonar.sourceEncoding=UTF-8

  # ─── Vulnerabilites des dependances ──────────────────────────────────────────
  # Le depot n'avait aucune analyse : une CVE publiee dans Spring Boot, jjwt ou une dependance
  # npm serait restee invisible. Deux mecanismes complementaires, aucun ne demandant de compte
  # tiers : la revue des dependances AJOUTEES par une PR (bloque l'entree d'un paquet vulnerable)
  # et l'audit de l'arbre npm DEJA installe (rattrape ce qui est entre avant ce garde-fou).
  security:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    # Le secret est expose en variable d'environnement pour pouvoir etre TESTE : le contexte
    # `secrets` n'est pas evaluable dans un `if` d'etape. Meme detour que le job SonarCloud.
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      # PR uniquement : l'action compare deux etats de l'arbre de dependances, elle n'a pas de
      # base de comparaison sur un push direct.
      - name: Review dependencies added by this PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Rapporte sans bloquer, DELIBEREMENT — et cette exception est datee, pas permanente.
      #
      # L'arbre porte aujourd'hui deux vulnerabilites « high », toutes deux verifiees comme
      # inatteignables dans le produit deploye :
      #   - react-router (GHSA-qwww-vcr4-c8h2) : contournement CSRF en mode RSC. L'application
      #     est une SPA classique (BrowserRouter, aucun createBrowserRouter ni RSC) : le chemin
      #     vulnerable n'existe pas ici. Le correctif impose de REDESCENDRE en 7.11.0.
      #   - vite (GHSA-fx2h-pf6j-xcff) : contournement de server.fs.deny sur chemins alternes
      #     Windows. Concerne le SERVEUR DE DEV. Le Dockerfile est multi-etapes : vite n'existe
      #     que dans l'etage de build, l'image finale est un nginx servant dist/. Reel en
      #     revanche sur un poste de developpement Windows. Correctif : vite 8 (deux versions
      #     majeures d'ecart, pas de retroportage en 5.x).
      #
      # Bloquer ici rendrait le job rouge en permanence pour deux failles non exposees, et un
      # job toujours rouge cesse d'etre lu — c'est ainsi qu'on rate la troisieme. La protection
      # reelle est l'etape precedente, qui refuse toute NOUVELLE dependance vulnerable ; celle-ci
      # sert de rappel. A repasser bloquant apres la montee de vite.
      - name: npm audit (frontend, informational)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

      # OWASP Dependency-Check couvre le versant Java, que npm audit ne voit pas. Il exige
      # desormais une cle NVD : sans elle, le telechargement de la base est limite en debit au
      # point d'etre inutilisable (plusieurs dizaines de minutes, puis echec). Le job s'execute
      # donc uniquement si la cle est fournie, sur le meme principe que SonarCloud plus haut.
      - name: Set up JDK 17
        if: ${{ env.NVD_API_KEY != '' }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency-Check (backend)
        if: ${{ env.NVD_API_KEY != '' }}
        working-directory: backend
        run: >
          mvn -B org.owasp:dependency-check-maven:10.0.4:check
          -DnvdApiKey="$NVD_API_KEY"
          -DfailBuildOnCVSS=8
          -DassemblyAnalyzerEnabled=false
