# Configuration Nginx de production pour le frontend ForsaLaw.
# Sert le SPA compile et fait office de reverse proxy vers le backend : tout passe donc par
# une SEULE origine, ce qui rend le CORS inutile et laisse le cookie d'authentification
# (SameSite=Lax) fonctionner naturellement.

# Protocole d'ORIGINE, tel que vu par le navigateur.
#
# Nginx est desormais lui-meme derriere le terminaisseur TLS (service « proxy », Caddy) : a
# l'interieur du reseau Docker, $scheme vaut toujours "http". Transmettre $scheme tel quel
# annoncerait donc "http" a Spring pour une requete arrivee en HTTPS, avec deux consequences
# silencieuses : les URI de redirection OAuth2 seraient reconstruites en http (Google refuse
# alors la redirection), et Spring considererait la connexion comme non securisee. On
# privilegie donc l'en-tete recu du proxy amont, en se rabattant sur $scheme quand il n'y en a
# pas (execution sans terminaisseur devant, ou `nginx -t` hors Docker).
#
# Ce bloc est en contexte http : les fichiers de conf.d y sont inclus.
map $http_x_forwarded_proto $forsalaw_proto {
    default $scheme;
    "~."    $http_x_forwarded_proto;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolution DNS a l'EXECUTION plutot qu'au demarrage.
    # 127.0.0.11 est le resolveur interne de Docker ; "backend" est le nom du service dans
    # docker-compose.prod.yml. Passer par une variable evite deux pieges d'un bloc `upstream`
    # classique : Nginx refuserait de demarrer si le backend n'est pas encore resolvable, et
    # il conserverait ensuite l'ancienne adresse IP apres une recreation du conteneur.
    # Effet de bord utile : `nginx -t` devient validable hors de Docker (aucune resolution
    # de nom au chargement de la configuration).
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $forsalaw_backend http://backend:8080;

    # Uploads : 10 Mo par fichier, mais jusqu'a 5 pieces jointes par message de messagerie
    # (60 Mo par requete cote Spring). La valeur par defaut de Nginx est de 1 Mo : sans cette
    # ligne, tout depot de document echouerait en 413 avant meme d'atteindre l'application.
    client_max_body_size 60m;

    # Compression des reponses textuelles (le JS du bundle est le poste le plus lourd).
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ─── API REST ───────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass $forsalaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forsalaw_proto;
    }

    # ─── OAuth2 Google ──────────────────────────────────────────────────────
    # Ces deux prefixes sont servis par Spring Security, pas par le SPA. Sans eux, le navigateur
    # recevrait index.html au lieu de la redirection vers Google : la connexion Google serait
    # cassee en production alors qu'elle fonctionne en dev (le proxy Vite les relaie deja).
    location /oauth2/ {
        proxy_pass $forsalaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forsalaw_proto;
    }

    location /login/oauth2/ {
        proxy_pass $forsalaw_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forsalaw_proto;
    }

    # ─── WebSocket / SockJS (messagerie temps reel) ─────────────────────────
    location /ws/ {
        proxy_pass $forsalaw_backend;
        proxy_http_version 1.1;

        # En-tetes d'upgrade : sans eux, le handshake WebSocket echoue et SockJS bascule
        # indefiniment sur ses transports de repli.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forsalaw_proto;

        # Une connexion STOMP reste ouverte : le delai par defaut (60 s) la couperait
        # regulierement malgre les heartbeats.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # Le repli "xhr-streaming" de SockJS pousse les evenements au fil de l'eau :
        # la bufferisation de Nginx les retiendrait jusqu'a remplissage du tampon.
        proxy_buffering off;
    }

    # ─── Fichiers statiques generes par Vite ────────────────────────────────
    # Les noms contiennent une empreinte de contenu : ils peuvent etre caches indefiniment.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ─── Routage SPA ────────────────────────────────────────────────────────
    # index.html ne doit JAMAIS etre cache : sinon un navigateur continue de demander les
    # anciens fichiers /assets/ apres un deploiement et l'application reste bloquee sur
    # une version obsolete.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
