# ForsaLaw - PostgreSQL + pgAdmin (ports distincts pour ne pas toucher à l'autre projet)
# Lancer : docker-compose up -d
# Arrêter : docker-compose down

services:
  postgres:
    # Image avec extension pgvector pour le RAG (recherche vectorielle)
    image: pgvector/pgvector:pg16
    container_name: forsalaw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forsalaw_rag
      POSTGRES_USER: forsalaw
      POSTGRES_PASSWORD: forsalaw
    ports:
      - "5433:5432"
    volumes:
      - forsalaw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forsalaw -d forsalaw"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Stockage objet compatible S3 pour le developpement local (equivalent d'AWS S3 en prod).
  # Console web : http://localhost:9001 (minioadmin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: forsalaw-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - forsalaw_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cree le bucket au premier demarrage puis s'arrete (l'application ne cree pas le bucket).
  minio-init:
    image: minio/mc:latest
    container_name: forsalaw-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/forsalaw-documents &&
      echo 'Bucket forsalaw-documents pret.'
      "

  # Broker STOMP externe pour la messagerie temps reel (scaling multi-instances).
  # Console web : http://localhost:15672 (forsalaw / forsalaw)
  # Le plugin STOMP n'est pas actif dans l'image : on l'active avant de demarrer le serveur.
  # Utilisateur dedie plutot que "guest" : guest est restreint au loopback par RabbitMQ, ce qui
  # refuserait la connexion venant de l'hote via le port publie.
  rabbitmq:
    image: rabbitmq:3-management
    container_name: forsalaw-rabbitmq
    restart: unless-stopped
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_stomp && rabbitmq-server"
    environment:
      RABBITMQ_DEFAULT_USER: forsalaw
      RABBITMQ_DEFAULT_PASS: forsalaw
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # console de gestion
      - "61613:61613"   # STOMP (utilise par le relais Spring)
    volumes:
      - forsalaw_rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vectorisation (RAG) : Text Embeddings Inference de HuggingFace, servant bge-m3.
  # Auto-heberge et non API tierce : les pieces confidentielles des cabinets (niveau 3 du
  # corpus) ne doivent pas sortir de l'infrastructure pour etre vectorisees.
  # Sur machine sans GPU, la vectorisation fonctionne mais reste lente : c'est acceptable
  # pour du developpement, pas pour ingerer un corpus complet.
  # Version 1.7 et non 1.5 : le telechargeur de la 1.5 echoue sur bge-m3 avec
  # « Could not download model artifacts / relative URL without a base ». Verifie :
  # depuis le meme conteneur, huggingface.co sert bien le fichier concerne (HTTP 200,
  # une redirection), aucune variable de proxy n'est injectee, et la 1.7 franchit le
  # meme point sans erreur. Le defaut vient du client HF embarque dans la 1.5.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.7
    container_name: forsalaw-embeddings
    restart: unless-stopped
    # --max-batch-tokens est INDISPENSABLE. Au defaut de TEI (16384), le lot de chauffe
    # fait traverser 16384 jetons aux 24 couches du modele, par-dessus 2,2 Go de poids en
    # float32 : le conteneur se fait tuer par le noyau (OOMKilled) juste apres
    # « Warming up model », sans message d'erreur, et repart en boucle indefiniment.
    # Constate sur une VM Docker de 8 Go. A 2048 jetons, le service est sain en ~20 s.
    # Les chunks d'articles font quelques centaines de jetons : un lot plus large
    # n'apporterait rien, le processeur etant de toute facon le facteur limitant.
    #
    # --max-client-batch-size est un plafond de VALIDATION de requete, pas un garde-fou
    # memoire : TEI redecoupe ensuite selon --max-batch-tokens. Il doit rester >= a
    # forsalaw.rag.embedding.batch-size (16) cote Java, sinon TEI renvoie
    # « HTTP 413 batch size 16 > maximum allowed batch size 8 » et l'ingestion echoue.
    command: --model-id BAAI/bge-m3 --port 80 --max-batch-tokens 2048 --max-client-batch-size 32
    ports:
      - "8090:80"
    volumes:
      # Le modele pese ~2,2 Go : sans ce volume il serait retelecharge a chaque demarrage.
      - forsalaw_embeddings_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Le premier demarrage telecharge le modele : compter plusieurs minutes.
      start_period: 600s

  # Reformulation HyDE avant vectorisation (voir HydeQueryRewriter) : auto-heberge pour la
  # meme raison que TEI ci-dessus -- une question de recherche peut porter sur un fait
  # confidentiel au meme titre qu'un document. Image CPU-compatible par defaut, comme TEI :
  # fonctionne sans GPU (plus lent), le GPU a ete valide manuellement (docker run --gpus all)
  # plutot que fige ici, pour ne pas faire echouer `docker compose up` sur une machine sans
  # pilote nvidia (meme choix que le service embeddings ci-dessus).
  #
  # Ollama ne livre aucun modele par defaut : l'entrypoint demarre le serveur, attend qu'il
  # reponde, puis tire le modele configure -- sans quoi le premier appel de recherche
  # echouerait avec "model not found" plutot que d'etre absent proprement.
  hyde:
    image: ollama/ollama:latest
    container_name: forsalaw-hyde
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        until curl -sf http://localhost:11434/ >/dev/null 2>&1; do sleep 1; done
        ollama pull "${HYDE_MODEL:-qwen2.5:3b-instruct}"
        wait
    environment:
      HYDE_MODEL: ${HYDE_MODEL:-qwen2.5:3b-instruct}
    ports:
      - "11434:11434"
    volumes:
      # Le modele (~2 Go en 3B) : sans ce volume il serait retelecharge a chaque demarrage.
      - forsalaw_hyde_cache:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 15s
      timeout: 5s
      retries: 10
      # Le premier demarrage tire le modele : compter plusieurs minutes.
      start_period: 300s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: forsalaw-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@forsalaw.com
      PGADMIN_DEFAULT_PASSWORD: forsalaw
    ports:
      - "5051:80"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  forsalaw_pgdata:
  forsalaw_miniodata:
  forsalaw_rabbitmqdata:
  forsalaw_embeddings_cache:
  forsalaw_hyde_cache:
