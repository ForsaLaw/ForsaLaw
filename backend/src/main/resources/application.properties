# ForsaLaw Backend
#
# Variables d'environnement utiles (secrets : ne pas committer ; utiliser un fichier .env local ou la configuration IDE) :
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET, JWT_EXPIRATION_MS
#   GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, OAUTH2_SUCCESS_REDIRECT_URI
#   MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_FROM
#   PASSWORD_RESET_FRONTEND_URL
#   FRONTEND_BASE_URL - lien dans les e-mails (sans front : Swagger ; valeur par defaut ci-dessous)
#   NOTIFICATIONS_TIMEZONE - fuseau IANA pour les rappels RDV J-1 / H-1
#   JITSI_BASE_URL - service de visioconference gratuit pour les RDV en ligne
#   ADMIN_SUPPORT_EMAIL - email admin pour les demandes de deblocage de compte
#   SERVER_PORT
#
spring.application.name=forsalaw-backend
server.port=${SERVER_PORT:8081}
# Ne jamais exposer le message d'exception interne dans la reponse HTTP (fuite d'information).
server.error.include-message=never
server.error.include-stacktrace=never

# PostgreSQL (Docker du projet par défaut via backend/docker-compose.yml).
# Pour une base locale: surcharger DB_URL (ex: jdbc:postgresql://localhost:5432/forsalaw).
# DB_USERNAME et DB_PASSWORD sont OBLIGATOIRES (pas de valeur par defaut) : l'application refuse
# de demarrer si ces variables ne sont pas fournies (fail-fast, aucune credential codee en dur).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/forsalaw}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate : le schema appartient a Flyway (V0 baseline + migrations Vn), PARTOUT.
#
# validate par defaut, et non plus update. Sous "update", Hibernate corrige silencieusement
# tout ecart entre les entites et la base : le schema reel finit par dependre de l'historique
# des demarrages plutot que des migrations, et une migration manquante ne se voit qu'en
# production, sur une base neuve ou personne n'a jamais tourne en "update". "validate" fait
# echouer le demarrage sur un tel ecart, ce qui est precisement le comportement recherche.
#
# Verifie sur une base VIERGE (les 15 migrations V0->V14 appliquees, puis validation) : aucun
# ecart. Valider contre une base ayant deja tourne en "update" ne prouverait rien, celle-ci
# ayant pu etre corrigee au fil des demarrages.
#
# Consequence : toute evolution d'entite exige desormais une migration. Repasser en "update"
# (JPA_DDL_AUTO=update) reste possible en dernier recours local, jamais en production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}

# Flyway actif : V0__baseline (schema complet, bases neuves), V1__rag (pgvector, idempotent),
# V2__fix_audit_bytea (correctif). baseline-on-migrate adopte les bases existantes non vides ;
# baseline-version=0 => seul V0 est saute sur une base existante (V1 et V2 s'appliquent partout).
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
# Ne pas journaliser le SQL en production (bruit + fuite de structure/donnees dans les logs).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# JWT : JWT_SECRET est OBLIGATOIRE (pas de valeur par defaut) : cle longue et securisee (>= 32 caracteres).
# L'application refuse de demarrer si JWT_SECRET n'est pas fourni (fail-fast, aucun secret code en dur).
forsalaw.jwt.secret=${JWT_SECRET}
forsalaw.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS : origines autorisees pour le frontend (liste separee par des virgules). Surcharger en production.
forsalaw.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Cookie d'authentification (JWT en HttpOnly ; le front n'a plus le token en JavaScript).
# secure : DOIT rester false en developpement sur http://localhost (sinon le navigateur ignore
# le cookie) et DOIT etre true en production (HTTPS).
# same-site : Lax obligatoire pour que le callback Google OAuth2 (navigation cross-site) renvoie
# bien le cookie ; Strict casserait le login Google.
forsalaw.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
forsalaw.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}

# OAuth2 Google (connexion avec Google)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:disabled-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
# Page front qui reçoit ?token= après Google (jamais Swagger ; voir aussi FRONTEND_BASE_URL pour les e-mails)
forsalaw.oauth2.success-redirect-uri=${OAUTH2_SUCCESS_REDIRECT_URI:http://localhost:3000/auth/google/callback}

# SMTP — reinitialisation de mot de passe et notifications RDV.
#
# AUCUN fournisseur par defaut. L'hote etait auparavant smtp.gmail.com : un deploiement qui
# oubliait MAIL_HOST se connectait donc silencieusement a Gmail, avec ses limites (500 envois
# par jour) et son classement en indesirable pour du courrier transactionnel. Sans MAIL_HOST,
# l'envoi est desormais simplement inactif — panne visible plutot que mauvais fournisseur.
#
# Le code est agnostique (RdvNotificationEmailService n'utilise que JavaMailSender) : SendGrid,
# Resend, AWS SES ou tout autre SMTP fonctionnent sans modification, par configuration seule.
#
# Les noms SPRING_MAIL_HOST / SPRING_MAIL_PORT / SPRING_MAIL_USERNAME / SPRING_MAIL_PASSWORD
# fonctionnent aussi : Spring lie ces variables directement a spring.mail.*, et une variable
# d'environnement l'emporte sur ce fichier. MAIL_* reste accepte pour ne rien casser.
#
# TLS : starttls convient aux ports 587 (SendGrid, SES, Resend). Pour un fournisseur en TLS
# implicite (port 465), passer MAIL_STARTTLS=false et MAIL_SSL_ENABLE=true.
# Debogage SMTP (tres verbeux) : spring.mail.properties.mail.debug=true
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.connectiontimeout=${MAIL_CONNECT_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.timeout=${MAIL_TIMEOUT_MS:5000}
spring.mail.properties.mail.smtp.writetimeout=${MAIL_WRITE_TIMEOUT_MS:5000}
# Expediteur : doit etre un domaine que vous controlez et dont les enregistrements SPF/DKIM
# autorisent le fournisseur, sans quoi le courrier partira en indesirable quel que soit le SMTP.
forsalaw.mail.from=${MAIL_FROM:${MAIL_USERNAME:}}
# Page front avec ?token=... (sans front en developpement : conserver l'URL ci-dessous ou une URL factice ; le lien dans l'e-mail reste inutilisable tant que le front n'existe pas).
forsalaw.password-reset.frontend-url=${PASSWORD_RESET_FRONTEND_URL:http://localhost:4200/reset-password}
# Lien "Acceder a ForsaLaw" dans les e-mails RDV. Sans frontend : valeur par defaut = Swagger (meme machine que l'API).
# Lorsque le front est disponible : FRONTEND_BASE_URL=http://localhost:4200 (ou l'URL de production).
forsalaw.app.frontend-base-url=${FRONTEND_BASE_URL:http://localhost:8081/swagger-ui.html}
# Fuseau IANA pour les rappels planifies J-1 (08:00) et H-1 (toutes les 15 min). Ex. : Africa/Tunis, Europe/Paris.
forsalaw.notifications.timezone=${NOTIFICATIONS_TIMEZONE:Africa/Tunis}

# Email de destination pour les demandes de deblocage de compte.
forsalaw.support.admin-email=${ADMIN_SUPPORT_EMAIL:admin@forsalaw.local}

# Amorcage du premier compte ADMIN (AdminSeeder). AUCUN mot de passe n'est ecrit dans le code
# ni dans une migration : le secret vient uniquement de l'environnement, et n'est donc jamais
# versionne. Le compte amorce detient tous les droits — ADMIN_SEED_PASSWORD doit etre long
# (16 caracteres minimum, refus au demarrage sinon) et aleatoire, pas un mot de passe choisi.
admin.seed.email=${ADMIN_SEED_EMAIL:}
admin.seed.password=${ADMIN_SEED_PASSWORD:}
# A METTRE A true EN PRODUCTION. Sans cela, un deploiement sans aucun admin demarre normalement
# et ne se revele inutilisable qu'au moment ou quelqu'un tente d'administrer : plus personne ne
# peut verifier un avocat ni moderer. A true, le demarrage est interrompu franchement.
admin.seed.required=${ADMIN_SEED_REQUIRED:false}

# URL publique de l'API (liens de telechargement des pieces jointes messagerie, JWT dans la query).
forsalaw.server.public-url=${PUBLIC_API_BASE_URL:http://localhost:8081}

# Admin messagerie : empreinte SHA-256 du texte (pas de lecture en clair). Poivre optionnel (variable ADMIN_MESSENGER_HASH_PEPPER).
forsalaw.messenger.admin.hash-pepper=${ADMIN_MESSENGER_HASH_PEPPER:}

# Pieces jointes messagerie : validation type/taille, scan ClamAV optionnel.
# (Le stockage est delegue au coffre-fort documentaire, donc au stockage objet ci-dessous.)
forsalaw.messenger.attachments.max-size-bytes=${MESSENGER_ATTACHMENT_MAX_BYTES:10485760}
forsalaw.messenger.attachments.max-files-per-message=${MESSENGER_ATTACHMENT_MAX_FILES:5}
forsalaw.messenger.attachments.download-token-expiration-ms=${MESSENGER_ATTACHMENT_DL_TOKEN_MS:900000}
forsalaw.messenger.attachments.clamav.enabled=${CLAMAV_ENABLED:false}
forsalaw.messenger.attachments.clamav.host=${CLAMAV_HOST:localhost}
forsalaw.messenger.attachments.clamav.port=${CLAMAV_PORT:3310}

# RAG : vectorisation via un service TEI voisin servant bge-m3 (auto-heberge).
# Auto-heberge et non API tierce : les documents du niveau 3 sont des pieces confidentielles
# de cabinets, elles ne doivent pas sortir de l'infrastructure pour etre vectorisees.
# dimensions DOIT correspondre a la colonne vector(N) de legal_document_chunk.
forsalaw.rag.embedding.base-url=${EMBEDDING_BASE_URL:http://localhost:8090}
forsalaw.rag.embedding.model-name=${EMBEDDING_MODEL:BAAI/bge-m3}
forsalaw.rag.embedding.dimensions=${EMBEDDING_DIMENSIONS:1024}
forsalaw.rag.embedding.batch-size=${EMBEDDING_BATCH_SIZE:16}
forsalaw.rag.embedding.timeout-seconds=${EMBEDDING_TIMEOUT_SECONDS:120}

# Reformulation HyDE avant vectorisation : mesure sur le corpus reel, une question brute
# embeddee directement manque son article de reponse dans 6 cas sur 10 (voir
# LegalChunkSearchService). Auto-heberge (Ollama), meme raison que bge-m3 : une question de
# recherche peut porter sur un fait confidentiel.
# enabled=false bascule sur NoOpHydeQueryRewriter (question brute systematique), utile en test
# ou si le sidecar Ollama n'est pas disponible.
forsalaw.rag.hyde.enabled=${HYDE_ENABLED:true}
forsalaw.rag.hyde.base-url=${HYDE_BASE_URL:http://localhost:11434}
# 3B et non 7B : sur ce GPU de 6 Go, TEI en occupe deja ~1,5 Go, un modele 7B serait trop
# proche du plafond qui avait declenche l'OOM de TEI (voir docker-compose.yml, service embeddings).
forsalaw.rag.hyde.model=${HYDE_MODEL:qwen2.5:3b-instruct}
forsalaw.rag.hyde.timeout-seconds=${HYDE_TIMEOUT_SECONDS:8}

# Assistant en flux (/api/ai/chat) : meme sidecar Ollama que HyDE par defaut (herite
# base-url/model ci-dessus), surchargeable independamment si un modele different s'averait
# preferable pour la generation de reponse que pour la reformulation de requete.
# read-timeout-seconds s'applique PAR LECTURE (tant qu'un jeton arrive dans cette fenetre, une
# generation plus longue continue normalement), pas a la duree totale de la reponse.
forsalaw.rag.chat.base-url=${CHAT_BASE_URL:${forsalaw.rag.hyde.base-url}}
forsalaw.rag.chat.model=${CHAT_MODEL:${forsalaw.rag.hyde.model}}
forsalaw.rag.chat.read-timeout-seconds=${CHAT_READ_TIMEOUT_SECONDS:30}

# Routage : classification de la question dans un DomaineJuridique, pour recommander des avocats
# de la bonne matiere. Meme sidecar que HyDE et la generation par defaut.
# L'appel est lance EN PARALLELE de la recherche et de la generation : il n'allonge pas le delai
# avant le premier jeton. Desactivable (enabled=false) sans impact sur la reponse elle-meme.
forsalaw.rag.routing.enabled=${ROUTING_ENABLED:true}
forsalaw.rag.routing.base-url=${ROUTING_BASE_URL:${forsalaw.rag.hyde.base-url}}
forsalaw.rag.routing.model=${ROUTING_MODEL:${forsalaw.rag.hyde.model}}
forsalaw.rag.routing.timeout-seconds=${ROUTING_TIMEOUT_SECONDS:8}

# Budget de jetons IA. Le quota par utilisateur est porte par users.daily_token_budget (defaut
# en base), surchargeable par compte ; les deux plafonds ci-dessous sont globaux.
# Depot forfaitaire : preleve AVANT la generation puis ajuste au reel a la fin. Une requete
# abandonnee en cours de route conserve ce depot (voir AiTokenBudgetService) — c'est ce qui rend
# une boucle d'abandon couteuse, faute de quoi elle consommerait des jetons sans etre facturee.
forsalaw.ai.budget.deposit-tokens=${AI_BUDGET_DEPOSIT_TOKENS:1000}
forsalaw.ai.budget.monthly-global-tokens=${AI_BUDGET_MONTHLY_GLOBAL_TOKENS:5000000}

# Limitation de debit. Fenetre glissante d'une minute, seaux en memoire.
# ATTENTION : ces quotas sont PAR INSTANCE (seaux en memoire). Voir le commentaire Bucket4j
# dans pom.xml avant tout passage en multi-instance.
forsalaw.ratelimit.enabled=${RATELIMIT_ENABLED:true}
forsalaw.ratelimit.auth-per-minute=${RATELIMIT_AUTH_PER_MINUTE:10}
forsalaw.ratelimit.avocats-per-minute=${RATELIMIT_AVOCATS_PER_MINUTE:30}
forsalaw.ratelimit.ai-chat-per-minute=${RATELIMIT_AI_CHAT_PER_MINUTE:5}

# Requetes relayees par un proxy (Vite en dev, load balancer en prod) : sans cela,
# getRemoteAddr() renvoie l'IP DU PROXY et tous les utilisateurs partagent le meme seau — les
# 10 premieres connexions par minute verrouilleraient la plateforme entiere.
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:framework}

# Content-Security-Policy applique aux reponses de CE service (API JSON + Swagger UI).
# 'unsafe-inline' sur script-src/style-src est impose par Swagger UI, qui injecte scripts et
# styles en ligne : sans lui, la documentation ne s'affiche plus. Le compromis est acceptable
# ici parce que ce service ne rend aucune page utilisateur — le front React est servi par son
# propre serveur, qui doit appliquer sa PROPRE politique, plus stricte (sans 'unsafe-inline').
# frame-ancestors 'none' double X-Frame-Options: DENY (les navigateurs recents privilegient CSP).
forsalaw.security.content-security-policy=${CONTENT_SECURITY_POLICY:default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'}

# Decoupage : bge-m3 accepte 8192 tokens, la limite ci-dessous evite surtout les articles
# exceptionnellement longs. Le decoupage suit les frontieres d'articles, pas ces tailles.
forsalaw.rag.chunking.max-chars=${RAG_CHUNK_MAX_CHARS:4000}
forsalaw.rag.chunking.overlap-chars=${RAG_CHUNK_OVERLAP_CHARS:200}

# Seuil de detection des PDF numerises : en dessous, l'ingestion echoue explicitement
# plutot que de creer zero chunk en signalant un succes.
forsalaw.rag.ingestion.min-chars-per-page=${RAG_MIN_CHARS_PER_PAGE:80}

# Import en masse du corpus historique deja converti en Markdown sur disque.
# DESACTIVE par defaut : c'est un traitement par lots de plusieurs heures qui arrete la JVM
# une fois termine, a lancer expressement et jamais sur une instance qui sert du trafic.
# La reprise apres coupure est automatique (les fichiers deja en base sont sautes).
forsalaw.rag.corpus-import.enabled=${CORPUS_IMPORT_ENABLED:false}
forsalaw.rag.corpus-import.directory=${CORPUS_IMPORT_DIR:}
forsalaw.rag.corpus-import.code-name=${CORPUS_IMPORT_CODE:}
forsalaw.rag.corpus-import.tier=${CORPUS_IMPORT_TIER:1}
forsalaw.rag.corpus-import.limit=${CORPUS_IMPORT_LIMIT:0}
forsalaw.rag.corpus-import.effective-date=${CORPUS_IMPORT_EFFECTIVE_DATE:}

# Collecte JORT : DESACTIVEE par defaut. iort.gov.tn est un service public ; la tache ne doit
# etre activee que sur UNE instance, deliberement, et jamais en developpement ni en CI.
forsalaw.rag.jort.enabled=${JORT_ENABLED:false}
forsalaw.rag.jort.base-url=${JORT_BASE_URL:https://www.iort.gov.tn}
forsalaw.rag.jort.index-path=${JORT_INDEX_PATH:/}
forsalaw.rag.jort.cron=${JORT_CRON:0 30 2 * * TUE,FRI}
forsalaw.rag.jort.delay-between-requests-ms=${JORT_DELAY_MS:3000}
forsalaw.rag.jort.max-issues-per-run=${JORT_MAX_ISSUES:5}
# Selecteurs CSS NON verifies contre le site reel : a calibrer avant activation.
forsalaw.rag.jort.selector.issue-link=${JORT_SELECTOR_LINK:a[href*=jort]}
forsalaw.rag.jort.selector.issue-content=${JORT_SELECTOR_CONTENT:.contenu, .content, article, main}

# WebSocket / STOMP : broker en memoire par defaut (mono-instance).
# Passer relay-enabled a true pour relayer vers un broker externe (RabbitMQ + plugin STOMP) :
# obligatoire des qu'il y a plusieurs instances, sinon un message publie par l'instance A
# n'atteint pas un client connecte a l'instance B.
forsalaw.websocket.broker.relay-enabled=${WS_BROKER_RELAY_ENABLED:false}
forsalaw.websocket.broker.host=${WS_BROKER_HOST:localhost}
forsalaw.websocket.broker.port=${WS_BROKER_PORT:61613}
forsalaw.websocket.broker.virtual-host=${WS_BROKER_VHOST:/}
forsalaw.websocket.broker.client-login=${WS_BROKER_USER:forsalaw}
forsalaw.websocket.broker.client-passcode=${WS_BROKER_PASSWORD:forsalaw}
forsalaw.websocket.broker.system-login=${WS_BROKER_SYSTEM_USER:forsalaw}
forsalaw.websocket.broker.system-passcode=${WS_BROKER_SYSTEM_PASSWORD:forsalaw}
forsalaw.websocket.broker.heartbeat-ms=${WS_BROKER_HEARTBEAT_MS:10000}

# Coffre-fort numérique : stockage objet (S3 ou MinIO), partage entre toutes les instances.
# En local/dev : MinIO via S3_ENDPOINT=http://localhost:9000 + cles statiques.
# En production : laisser S3_ACCESS_KEY/S3_SECRET_KEY vides pour utiliser le role IAM de l'instance.
forsalaw.storage.s3.bucket=${S3_BUCKET:forsalaw-documents}
forsalaw.storage.s3.region=${S3_REGION:us-east-1}
forsalaw.storage.s3.endpoint-override=${S3_ENDPOINT:}
forsalaw.storage.s3.path-style-access=${S3_PATH_STYLE:true}
forsalaw.storage.s3.access-key=${S3_ACCESS_KEY:}
forsalaw.storage.s3.secret-key=${S3_SECRET_KEY:}

# Limite de taille des uploads multipart, PAR FICHIER et par requete (surchargeables).
# Relevee de 10 a 60 Mo (alignee sur nginx client_max_body_size) pour l'ingestion admin de PDF
# juridiques : une compilation reglementaire complete peut depasser largement 10 Mo (ex. le
# recueil BCT du corpus ingere fait 863 pages). Cette limite est GLOBALE a Spring (pas par
# endpoint) : elle assouplit aussi le plafond des pieces jointes de messagerie, ce qui est sans
# consequence, celles-ci restant bornees par ailleurs (max-files-per-message=5).
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE:60MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST:60MB}

# Swagger UI : http://localhost:8081/swagger-ui.html
# Documentation API (JSON) : http://localhost:8081/v3/api-docs
# Optionnel :
# springdoc.swagger-ui.path=/swagger-ui.html
# springdoc.api-docs.path=/v3/api-docs
# En production : desactiver la doc exposee - springdoc.api-docs.enabled=false et springdoc.swagger-ui.enabled=false

# --- WhatsApp Bridge ---
# Activer l'envoi WhatsApp en arriÃ¨re plan (mettre false pour tester sans envoyer de vrais messages)
forsalaw.whatsapp.enabled=${WHATSAPP_ENABLED:true}
forsalaw.whatsapp.bridge-url=${WHATSAPP_BRIDGE_URL:http://localhost:3099}
# Secret partage avec le bridge Node.js (envoye dans l'en-tete Authorization: Bearer). Doit etre identique
# a WHATSAPP_BRIDGE_TOKEN cote bridge. Sans valeur, aucun en-tete n'est envoye (le bridge refusera l'appel).
forsalaw.whatsapp.bridge-token=${WHATSAPP_BRIDGE_TOKEN:}

# ─── SOS Arrestation ────────────────────────────────────────────────────────
# Bouchons de paiement et de mobilisation : AUCUN encaissement ni SMS reel.
# Ils existent pour eprouver le flux complet en l'absence de compte marchand et de fournisseur
# SMS. Passer ces proprietes a false des que les integrations reelles sont disponibles : laisser
# le bouchon actif en production marquerait tout signalement comme paye.
forsalaw.sos.payment.stub-enabled=${SOS_PAYMENT_STUB:true}
forsalaw.sos.payment.stub-delay-seconds=${SOS_PAYMENT_STUB_DELAY_SECONDS:2}
forsalaw.sos.dispatch.stub-enabled=${SOS_DISPATCH_STUB:true}
# Acquittement explicite du risque (SosStubGuard). Laisse a false, l'application REFUSE de
# demarrer si SOS est ouvert au public alors qu'un bouchon reste actif : un avertissement dans
# les journaux se noie, et les deux bouchons valent true par defaut. A ne passer a true que
# pour une demonstration hors production.
forsalaw.sos.stubs-acknowledged=${SOS_STUBS_ACKNOWLEDGED:false}
forsalaw.ratelimit.sos-per-minute=${RATELIMIT_SOS_PER_MINUTE:10}
tail -10 backend/src/main/resources/application.properties

# ─── Interrupteurs de fonctionnalites ───────────────────────────────────────
# SOS Arrestation : DESACTIVE par defaut, volontairement. Le paiement et la mobilisation des
# avocats sont encore des bouchons — un signalement affiche « Avocats penalistes mobilises »
# alors que PERSONNE n'a ete prevenu. Promettre a un proche qu'un avocat intervient sur une
# garde a vue sans que ce soit vrai expose a une responsabilite sans rapport avec le benefice
# d'une demonstration. N'activer qu'une fois la passerelle de paiement ET l'envoi de SMS reels.
# Desactive : /api/sos/** repond 503 et le bouton est masque cote front.
forsalaw.features.sos-arrest.enabled=${SOS_ARREST_ENABLED:false}
# Plafond de longueur de reponse de l'assistant (num_predict Ollama). Filet mecanique : un
# modele 3B respecte mal une limite enoncee dans la consigne (mesure : 1600-2000 caracteres
# pour « 3 a 5 phrases »). Volontairement au-dessus de la cible, pour couper les digressions
# sans trancher au milieu d'une phrase.
forsalaw.rag.chat.max-response-tokens=${CHAT_MAX_RESPONSE_TOKENS:420}

# ─── Supervision (Actuator / Micrometer) ────────────────────────────────────
# Exposition NOMINATIVE, jamais "*" : health pour les sondes, info/metrics/prometheus pour la
# supervision. Sont volontairement absents env, configprops, beans et heapdump, qui livreraient
# la configuration (adresses internes, forme des secrets) ou un instantane memoire.
management.endpoints.web.exposure.include=${ACTUATOR_ENDPOINTS:health,info,metrics,prometheus}
# Detail de sante reserve aux administrateurs : "always" exposerait a l'anonyme les URL et
# l'etat de PostgreSQL, MinIO et RabbitMQ. La sonde d'orchestration n'a besoin que du statut.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
# Sondes liveness/readiness : readiness bascule a DOWN pendant les migrations Flyway et le
# prechargement, ce qui evite de recevoir du trafic avant d'etre reellement pret.
management.endpoint.health.probes.enabled=true
# Sonde SMTP DESACTIVEE, apres constat en direct : elle ouvre une connexion au serveur de mail
# a chaque interrogation et la fait echouer quand MAIL_HOST est vide — or c'est la valeur par
# defaut assumee depuis le passage a un SMTP agnostique. L'agregat passait donc a DOWN sur une
# application parfaitement fonctionnelle (verifie : db UP, disque UP, seul mail DOWN, statut
# global DOWN, HTTP 503). Branche a un orchestrateur, cela suffisait a faire retirer du service
# ou redemarrer en boucle une instance saine. Un envoi de courrier indisponible est une
# degradation de fonctionnalite, pas une indisponibilite du service : il se constate dans les
# journaux, pas en tuant l'instance.
management.health.mail.enabled=false
# Readiness restreinte a ce qui rend REELLEMENT l'application incapable de servir : sans base,
# plus rien ne fonctionne. Une dependance annexe ne doit pas retirer l'instance du service.
management.endpoint.health.group.readiness.include=readinessState,db
# Histogramme des temps de reponse HTTP : sans lui, seules la moyenne et le maximum existent,
# et la moyenne masque precisement les lenteurs qui derangent (le premier jeton de l'assistant).
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=200ms,1s,3s,10s
# Etiquette portee par toutes les metriques : distingue les instances une fois le service
# replique, sinon leurs series se confondent.
management.metrics.tags.application=forsalaw-backend
