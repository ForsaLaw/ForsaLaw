# ============================================================================
# application-test.properties — profil "test" (tests d'integration @SpringBootTest).
# ----------------------------------------------------------------------------
# Fournit les secrets fail-fast qui, en PRODUCTION, sont OBLIGATOIRES et sans valeur
# par defaut (JWT_SECRET, DB_USERNAME, DB_PASSWORD). Sans eux, le contexte ne peut pas
# demarrer en CI (ou JWT_SECRET n'est pas defini).
#
# NB : la vraie base est fournie par Testcontainers via @ServiceConnection ; les valeurs
# datasource ci-dessous servent uniquement a resoudre les placeholders au chargement.
# ============================================================================
forsalaw.jwt.secret=test-jwt-secret-please-change-min-32-bytes
spring.datasource.username=test
spring.datasource.password=test
